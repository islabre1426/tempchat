<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">

  <link rel="stylesheet" href="/src/style.css">

  <link rel="icon" type="image/png" href="/src/favicon/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/src/favicon/favicon.svg" />
  <link rel="shortcut icon" href="/src/favicon/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/src/favicon/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="tempchat" />
  <link rel="manifest" href="/src/favicon/site.webmanifest" />

  <title>Tempchat</title>
</head>
<body>
  <div id="container">
    <div id="chat">
      <div class="top">
        <button type="button" id="top-name" popovertarget="info-dialog"></button>
      </div>
      
      <div class="content"></div>

      <div class="input">
        <button id="upload-files" type="button">+</button>
        <input id="files" type="file" hidden multiple>
        <textarea name="message-input" id="message-input" placeholder="Send a message..."></textarea>
        <input type="submit" id="send-btn" value="&uparrow;">
      </div>
    </div>
  </div>

  <dialog id="name-dialog" open>
    <form>
      <div class="field">
        <label for="name">Enter name to appear as:</label>
        <input type="text" name="name" id="name" autocomplete="on">
      </div>

      <button type="button" id="create-account-btn" commandfor="name-dialog" command="close">Create account</button>
    </form>
  </dialog>

  <dialog id="info-dialog" popover="auto">
    <div class="dialog-menubar">
      <button type="button" class="close-button">X</button>
    </div>

    <p>Your information:</p>
    <table>
      <tr>
        <td>Name</td>
        <td id="info-name"></td>
      </tr>
      <tr>
        <td>ID</td>
        <td>
          <button type="button" id="copy-id"></button> (click to copy)
        </td>
      </tr>
    </table>
  </dialog>

  <script type="module" src="/src/js/main.js"></script>
</body>
</html>
